name: 조회수 수집

on:
  schedule:
    # GitHub 시간은 UTC 기준 (한국 시간 = UTC + 9)
    - cron: '17 */3 * * *'   # 3시간마다: 한국 시간 00:17, 03:17, 06:17 ... 21:17 (순위 변동 추적용)
    - cron: '50 14 * * *'    # 한국 시간 23:50: 그날의 마지막 수치
  workflow_dispatch:         # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 작품 지표 수집
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/collect.ps1

      - name: 수집 결과 저장
        if: always()
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "no changes"; exit 0 }
          $t = [DateTime]::UtcNow.AddHours(9).ToString('yyyy-MM-dd HH:mm')
          git commit -m "data: $t KST"
          git pull --rebase
          git push
